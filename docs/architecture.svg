<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="MemCore Governed Trust &amp; Hybrid Architecture">
  <title>MemCore Governed Trust &amp; Hybrid Architecture</title>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#131d31" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="edge-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#10b981"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#a78bfa"/>
    </marker>
    <style>
      .bg { fill: #070d19; }
      .zone { fill: #0b1325; stroke: #1e293b; stroke-width: 1; }
      .card { fill: #0f172a; stroke: #24344f; stroke-width: 1; filter: url(#card-shadow); }
      .card-accent { fill: #111e38; stroke: #3b82f6; stroke-width: 1.2; filter: url(#card-shadow); }
      .card-green { fill: #0b2320; stroke: #10b981; stroke-width: 1.2; filter: url(#card-shadow); }
      .card-purple { fill: #1c1536; stroke: #8b5cf6; stroke-width: 1.2; filter: url(#card-shadow); }
      .t-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-size: 13px; font-weight: 600; }
      .t-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .t-tag { fill: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      .edge { stroke: #475569; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
      .edge-green { stroke: #10b981; stroke-width: 1.4; fill: none; marker-end: url(#arr-green); }
      .edge-purple { stroke: #a78bfa; stroke-width: 1.3; fill: none; marker-end: url(#arr-purple); }
      .edge-dash { stroke: #334155; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <!-- Background Base -->
  <rect class="bg" width="960" height="520"/>
  <rect width="960" height="520" fill="url(#grid)" opacity="0.7"/>

  <!-- ==================== LANE 1: RAW INGEST & AUDIT ==================== -->
  <text class="t-tag" x="24" y="26">LANE 1 · RAW INGEST &amp; AUDIT — UNTRUSTED · NEVER RECALLED DIRECTLY</text>
  <rect class="zone" x="24" y="34" width="912" height="74" rx="8"/>

  <!-- Agent Execution -->
  <rect class="card" x="40" y="48" width="190" height="46" rx="6"/>
  <text class="t-title" x="135" y="67" text-anchor="middle">Agent Execution</text>
  <text class="t-sub" x="135" y="83" text-anchor="middle">turns · tools · delegations</text>

  <path class="edge" d="M230 71 H 290"/>

  <!-- Raw Ingest Journal -->
  <rect class="card" x="296" y="48" width="240" height="46" rx="6"/>
  <text class="t-title" x="416" y="67" text-anchor="middle">Raw Ingest Journal</text>
  <text class="t-sub" x="416" y="83" text-anchor="middle">append-only ledger · immutable</text>

  <path class="edge" d="M536 71 H 596"/>

  <!-- Semantic Review Queue -->
  <rect class="card" x="602" y="48" width="318" height="46" rx="6"/>
  <text class="t-title" x="761" y="67" text-anchor="middle">Semantic Review Queue</text>
  <text class="t-sub" x="761" y="83" text-anchor="middle">governed triage: remember | ignore | defer</text>

  <!-- Downward bridge to Lane 2 -->
  <path class="edge-dash" d="M416 94 V 132"/>
  <path class="edge-dash" d="M761 94 V 132"/>

  <!-- ==================== LANE 2: CANONICAL GOVERNED STORE & HYBRID SEARCH ==================== -->
  <text class="t-tag" x="24" y="132">LANE 2 · CANONICAL STORE &amp; LOCAL HYBRID SEARCH — AUTHORITATIVE MEMORY</text>
  <rect class="zone" x="24" y="140" width="912" height="236" rx="8"/>

  <!-- Admission Gate -->
  <rect class="card" x="40" y="154" width="190" height="88" rx="6"/>
  <text class="t-title" x="135" y="174" text-anchor="middle">Admission Gate</text>
  <text class="t-sub" x="135" y="193" text-anchor="middle">tombstones · duplicate hash</text>
  <text class="t-sub" x="135" y="209" text-anchor="middle">conflict detection · scope check</text>
  <text class="t-sub" x="135" y="225" text-anchor="middle">candidate → accepted</text>

  <path class="edge" d="M230 198 H 290"/>

  <!-- Canonical Store (SQLite WAL) -->
  <rect class="card-accent" x="296" y="154" width="240" height="88" rx="6"/>
  <text class="t-title" x="416" y="174" text-anchor="middle" fill="#60a5fa">Canonical Store</text>
  <text class="t-sub" x="416" y="193" text-anchor="middle">SQLite WAL · 18 migrations</text>
  <text class="t-sub" x="416" y="209" text-anchor="middle">immutable bitemporal history</text>
  <text class="t-sub" x="416" y="225" text-anchor="middle">valid_from / valid_until</text>

  <path class="edge-purple" d="M416 242 V 268"/>

  <!-- Vector Embedding Store -->
  <rect class="card-purple" x="296" y="274" width="240" height="88" rx="6"/>
  <text class="t-title" x="416" y="294" text-anchor="middle" fill="#c084fc">Vector Embeddings</text>
  <text class="t-sub" x="416" y="312" text-anchor="middle">memory_embedding (IEEE 754)</text>
  <text class="t-sub" x="416" y="328" text-anchor="middle">FastEmbed (in-process) · Ollama</text>
  <text class="t-sub" x="416" y="344" text-anchor="middle">9Router · OpenRouter · OpenAI</text>

  <!-- Connect Store & Embedding to Hybrid Search -->
  <path class="edge" d="M536 198 H 596"/>
  <path class="edge-purple" d="M536 318 H 596"/>

  <!-- Local Hybrid Recall -->
  <rect class="card-green" x="602" y="154" width="318" height="132" rx="6"/>
  <text class="t-title" x="761" y="176" text-anchor="middle" fill="#34d399">Hybrid Recall (RRF k=60)</text>
  <text class="t-sub" x="761" y="198" text-anchor="middle">Lane A: FTS5 BM25 + Thai Bigram (Lexical)</text>
  <text class="t-sub" x="761" y="216" text-anchor="middle">Lane B: Cosine Similarity (Semantic Vector)</text>
  <text class="t-sub" x="761" y="234" text-anchor="middle">Score(d) = 1/(60+rank_fts) + 1/(60+rank_vec)</text>
  <text class="t-sub" x="761" y="254" text-anchor="middle" fill="#6ee7b7">Exact terms + Semantic intent amplified</text>
  <text class="t-sub" x="761" y="272" text-anchor="middle">Token-budget bounded · Zero starvation</text>

  <!-- Output / Consumption -->
  <path class="edge-green" d="M761 286 V 308"/>
  <rect class="card" x="602" y="312" width="318" height="50" rx="6"/>
  <text class="t-title" x="761" y="331" text-anchor="middle">Consumers &amp; Deliverables</text>
  <text class="t-sub" x="761" y="349" text-anchor="middle">Python SDK (MemCore) · Prompt Inject · Export (AGENTS.md)</text>

  <!-- ==================== LANE 3: ENFORCEMENT BOUNDARY ==================== -->
  <text class="t-tag" x="24" y="400">ENFORCEMENT BOUNDARY — GUARANTEED IN SQL &amp; CODE · NEVER DELEGATED TO LLM</text>
  <rect class="zone" x="24" y="408" width="912" height="96" rx="8"/>

  <!-- Four Pillars -->
  <rect class="card" x="40" y="420" width="206" height="42" rx="6"/>
  <text class="t-title" x="143" y="438" text-anchor="middle">SQL Scope Confinement</text>
  <text class="t-sub" x="143" y="452" text-anchor="middle">project vs private boundary</text>

  <rect class="card" x="264" y="420" width="206" height="42" rx="6"/>
  <text class="t-title" x="367" y="438" text-anchor="middle">Tombstone Anti-Resurrection</text>
  <text class="t-sub" x="367" y="452" text-anchor="middle">prevents semantic drift replay</text>

  <rect class="card" x="488" y="420" width="206" height="42" rx="6"/>
  <text class="t-title" x="591" y="438" text-anchor="middle">4 Explicit Trust Labels</text>
  <text class="t-sub" x="591" y="452" text-anchor="middle">scope · lifecycle · verify · fresh</text>

  <rect class="card" x="712" y="420" width="208" height="42" rx="6"/>
  <text class="t-title" x="816" y="438" text-anchor="middle">Zero-Daemon Stdlib Core</text>
  <text class="t-sub" x="816" y="452" text-anchor="middle">100% offline · in-process ONNX</text>

  <!-- Bottom Principle -->
  <text class="t-sub" x="480" y="488" text-anchor="middle" fill="#64748b">A wrong memory is worse than no memory: raw history stays isolated, while canonical recall is strictly governed and ranked.</text>
</svg>
