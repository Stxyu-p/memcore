<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="MemCore trust architecture: raw journal never recalled directly, governed admission, scope-aware recall">
  <title>MemCore trust architecture</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <style>
      .bg{fill:#0b1120}
      .panel{fill:#111c33;stroke:#24344f;stroke-width:1}
      .zone{fill:#0f172a;stroke:#1e293b;stroke-width:1}
      .t1{fill:#e2e8f0;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:13px;font-weight:600}
      .t2{fill:#94a3b8;font-family:ui-sans-serif,system-ui,Segoe UI,sans-serif;font-size:11px}
      .t3{fill:#64748b;font-family:ui-sans-serif,system-ui,Segoe UI,sans-serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
      .edge{stroke:url(#edge);stroke-width:1.4;fill:none;marker-end:url(#arrow)}
      .edge-soft{stroke:#334155;stroke-width:1.1;fill:none;stroke-dasharray:3 3;marker-end:url(#arrow-soft)}
      .bar{fill:#1e293b}
      .bar-ok{fill:#14532d}
      .bar-warn{fill:#713f12}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="430" fill="#0b1120"/>

  <text class="t3" x="24" y="30">LANE 1 · RAW ACTIVITY — UNTRUSTED, NEVER RECALLED DIRECTLY</text>
  <rect class="zone" x="24" y="42" width="852" height="66" rx="8"/>
  <rect class="panel" x="44" y="56" width="180" height="38" rx="6"/>
  <text class="t1" x="134" y="72" text-anchor="middle">Agent turn</text>
  <text class="t2" x="134" y="87" text-anchor="middle">tool calls · delegation</text>
  <path class="edge" d="M224 75 H 292"/>
  <rect class="panel" x="300" y="56" width="230" height="38" rx="6"/>
  <text class="t1" x="415" y="72" text-anchor="middle">Raw ingest journal</text>
  <text class="t2" x="415" y="87" text-anchor="middle">append-only ledger</text>
  <path class="edge" d="M530 75 H 598"/>
  <rect class="panel" x="606" y="56" width="250" height="38" rx="6"/>
  <text class="t1" x="731" y="72" text-anchor="middle">Semantic review queue</text>
  <text class="t2" x="731" y="87" text-anchor="middle">remember → private candidate only</text>

  <text class="t3" x="24" y="140">LANE 2 · GOVERNED CANONICAL MEMORY — THE ONLY RECALL SOURCE</text>
  <rect class="zone" x="24" y="152" width="852" height="112" rx="8"/>
  <rect class="panel" x="44" y="168" width="196" height="38" rx="6"/>
  <text class="t1" x="142" y="184" text-anchor="middle">Admission gate</text>
  <text class="t2" x="142" y="199" text-anchor="middle">tombstone · duplicate · clash</text>
  <path class="edge" d="M240 187 H 292"/>
  <rect class="panel" x="300" y="168" width="230" height="38" rx="6"/>
  <text class="t1" x="415" y="184" text-anchor="middle">Canonical store</text>
  <text class="t2" x="415" y="199" text-anchor="middle">immutable versions · scoped</text>
  <path class="edge" d="M530 187 H 598"/>
  <rect class="panel" x="606" y="168" width="250" height="38" rx="6"/>
  <text class="t1" x="731" y="184" text-anchor="middle">Recall</text>
  <text class="t2" x="731" y="199" text-anchor="middle">ranked lane first · bounded budget</text>
  <path class="edge" d="M731 206 V 236"/>
  <rect class="panel" x="606" y="236" width="250" height="16" rx="4"/>
  <rect class="bar-ok" x="606" y="236" width="186" height="16" rx="4"/>
  <text class="t2" x="731" y="248" text-anchor="middle" fill="#0b1120">injected into prompt context</text>

  <path class="edge-soft" d="M415 108 V 164"/>
  <path class="edge-soft" d="M731 108 V 164"/>

  <text class="t3" x="24" y="298">ENFORCEMENT BOUNDARY — IN SQL, NOT IN THE MODEL</text>
  <rect class="zone" x="24" y="310" width="852" height="96" rx="8"/>
  <rect class="panel" x="44" y="326" width="196" height="32" rx="6"/>
  <text class="t1" x="142" y="347" text-anchor="middle">Membership</text>
  <rect class="panel" x="260" y="326" width="196" height="32" rx="6"/>
  <text class="t1" x="358" y="347" text-anchor="middle">Scope confinement</text>
  <rect class="panel" x="476" y="326" width="196" height="32" rx="6"/>
  <text class="t1" x="574" y="347" text-anchor="middle">Tombstones</text>
  <rect class="panel" x="692" y="326" width="164" height="32" rx="6"/>
  <text class="t1" x="774" y="347" text-anchor="middle">Trust labels</text>
  <text class="t2" x="142" y="374" text-anchor="middle">read + write boundary</text>
  <text class="t2" x="358" y="374" text-anchor="middle">project vs private</text>
  <text class="t2" x="574" y="374" text-anchor="middle">no silent resurrection</text>
  <text class="t2" x="774" y="374" text-anchor="middle">4 labels per row</text>
  <text class="t2" x="450" y="396" text-anchor="middle" fill="#64748b">A wrong memory is worse than no memory: nothing enters recall without a lifecycle, and nothing stays without a tombstone.</text>
</svg>
