[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memcore-omnix"
version = "2.11.0"
description = "Governed, bitemporal, local-first memory engine for autonomous AI agent fleets"
readme = "README.md"
authors = [
    { name = "P Choke & MIKA" }
]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]
keywords = ["memory", "ai-agents", "autonomous-agents", "sqlite", "fts5", "bitemporal", "governance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
memcore = "memcore.__main__:main"
memcore-mcp = "memcore.mcp_server:main"

[tool.setuptools.packages.find]
include = ["memcore*"]

[tool.setuptools.package-data]
memcore = ["schema/*.sql", "schema.sql"]

